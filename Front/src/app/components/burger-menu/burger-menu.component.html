<nav class="navbar">
  <a
    href="#banner"
    class="navbar__brand"
    (click)="handleMenuAction($event, 'banner')"
  >
    <img
      class="navbar__brand-logo"
      src="assets/images/logo-480w.webp"
      alt="NeoVintage"
    />
  </a>

  <button
    #toggleButton
    type="button"
    class="navbar__hamburger"
    [class.active]="isMenuOpen"
    (click)="toggleMenu()"
    [attr.aria-expanded]="isMenuOpen"
    aria-controls="main-nav-menu"
    [attr.aria-label]="isMenuOpen ? 'Fermer le menu' : 'Ouvrir le menu'"
  >
    <span class="navbar__hamburger-bar"></span>
    <span class="navbar__hamburger-bar"></span>
    <span class="navbar__hamburger-bar"></span>
  </button>

  <div
    #menuPanel
    id="main-nav-menu"
    class="navbar__menu"
    [class.active]="isMenuOpen"
    (click)="closeMenu()"
  >
    <div class="navbar__menu-card" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="navbar__menu-close"
        (click)="closeMenu()"
        aria-label="Fermer le menu"
      >
        ✕
      </button>

      <ul class="navbar__menu-list">
        @for (section of sections; track section.id) {
          <li class="navbar__menu-item">
            <a
              (click)="handleMenuAction($event, section.id)"
              class="navbar__menu-link"
              [class.navbar__menu-link--active]="activeSection === section.id"
              href="#{{ section.id }}"
            >
              {{ section.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
