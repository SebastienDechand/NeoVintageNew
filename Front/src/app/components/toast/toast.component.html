<div class="toast-stack">
  @for (toast of toasts(); track toast.id) {
    <div class="toast" [class.toast--success]="toast.type === 'success'" [class.toast--error]="toast.type === 'error'">
      <span class="toast-icon">
        @if (toast.type === 'success') {
          <svg lucideCircleCheck></svg>
        } @else {
          <svg lucideCircleAlert></svg>
        }
      </span>
      <p class="toast-message">{{ toast.message }}</p>
      <button type="button" class="toast-close" (click)="dismiss(toast.id)" aria-label="Fermer la notification">
        <svg lucideX></svg>
      </button>
    </div>
  }
</div>
