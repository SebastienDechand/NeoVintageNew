<button (click)="showLoginModal = true" class="edit-button">
  Éditer le contenu
</button>

@if (showLoginModal) {
  <div class="modal-overlay" (click)="closeModals($event)">
    <div class="modal-content">
      <div class="login-container">
        <h3>Connexion Admin</h3>
        <input
          type="email"
          [(ngModel)]="email"
          placeholder="Email"
          autocomplete="email"
        />
        <input
          type="password"
          [(ngModel)]="password"
          placeholder="Mot de passe"
          autocomplete="current-password"
        />
        <div class="modal-buttons">
          <button (click)="enableEdit()">Se connecter</button>
          <button (click)="showLoginModal = false">Annuler</button>
        </div>
      </div>
    </div>
  </div>
}

@if (editMode) {
  <div class="modal-overlay" (click)="closeModals($event)">
    <div class="modal-content edit-mode">
      <h2>Mode Édition</h2>

      <h3>Articles</h3>
      @for (photo of photos; track $index) {
        <div class="content-edit">
          <label>Titre :</label>
          <input [(ngModel)]="photos[$index].title" />
          <label>URL :</label>
          <input [(ngModel)]="photos[$index].url" />
        </div>
      }

      <h3>Créateurs</h3>
      @for (creator of creators; track $index) {
        <div class="content-edit">
          <label>Titre :</label>
          <input [(ngModel)]="creators[$index].title" />
          <label>Sous-titre :</label>
          <input [(ngModel)]="creators[$index].subtitle" />
          <label>Image URL :</label>
          <input [(ngModel)]="creators[$index].image" />
          <label>URL :</label>
          <input [(ngModel)]="creators[$index].url" />
        </div>
      }

      <div class="modal-buttons">
        <button (click)="saveAll()">Sauvegarder</button>
        <button (click)="editMode = false">Fermer</button>
      </div>
    </div>
  </div>
}
