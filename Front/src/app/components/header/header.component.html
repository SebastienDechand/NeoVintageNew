<section class="hero-container" id="banner">
  <span class="hero-badge">Friperie · Seconde main</span>

  <h1 class="hero-title">
    LA MODE <span class="hero-title-accent">RESPONSABLE</span>
  </h1>
  <p class="hero-subtitle">à portée de toutes et tous</p>

  <a class="pill pill--gradient hero-cta" href="#about">Découvrir la boutique</a>

  <div class="hero-polaroids">
    <img src="assets/images/friperie-1920w.webp" srcset="assets/images/friperie-480w.webp 480w, assets/images/friperie-768w.webp 768w, assets/images/friperie-1920w.webp 1920w" sizes="240px" alt="Vêtements de la friperie Neo Vintage" class="hero-polaroid hero-polaroid--1" />
    <img src="assets/images/banner1.webp" alt="Une femme avec un chapeau et un poncho coloré regarde l'objectif" class="hero-polaroid hero-polaroid--2" />
    <img src="assets/images/creators-1920w.webp" srcset="assets/images/creators-480w.webp 480w, assets/images/creators-768w.webp 768w, assets/images/creators-1920w.webp 1920w" sizes="240px" alt="Créations artisanales mises en avant par Neo Vintage" class="hero-polaroid hero-polaroid--3" />
  </div>
</section>

<div class="card-container">
  @for (card of cards; track $index) {
  <app-cards-banner
    [icon]="card.icon"
    [accent]="card.accent"
    [title]="card.title"
    [description]="card.description"
  >
  </app-cards-banner>
  }
</div>
