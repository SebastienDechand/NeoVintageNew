<section class="banner-container" id="banner">
  <img
    src="assets/images/banner1.webp"
    alt="Une femme avec un chapeau et un poncho coloré regarde l'objectif"
    class="banner-img"
  />

  <div class="banner-content">
    <img src="assets/images/logo-480w.webp" alt="Logo NeoVintage" class="banner-logo" />
    <div class="banner-text-container">
      <h1 class="banner-title">
        La mode responsable à portée de toutes et tous
      </h1>
    </div>
  </div>
</section>

<div class="card-container">
  @for (card of cards; track $index) {
  <app-cards-banner
    [icon]="card.icon"
    [title]="card.title"
    [description]="card.description"
  >
  </app-cards-banner>
  }
</div>
